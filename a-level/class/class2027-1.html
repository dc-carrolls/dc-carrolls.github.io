<!DOCTYPE html>
<html>
    <head>
        <script>
            function timesTable(){
                var table = document.getElementById("table").value; 
                var strOutput = "";
                let i
                for (i=1;i<10;i++){
                    strOutput = strOutput + "<p>" + i + "</p>";

                }
             
                var output = document.getElementById("output")


                output.innerHTML = strOutput + "<p>" + i + "</p>"
                return false;
            }
        </script> 
    </head>

    <body>

</html>
